<style>
    body {
        margin: 0;
        padding: 20px;
        font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        /* Un fond clair et lumineux, sans calque d'ombre */
        background: linear-gradient(-45deg, #e3f2fd, #fce4ec, #e8f5e9, #fff3e0);
        background-size: 400% 400%;
        /* Une animation de fond "beaucoup plus animée" */
        animation: gradientBG 15s ease infinite;
        color: #333; /* Texte sombre pour la lisibilité sur fond clair */
        display: flex;
        justify-content: center;
    }

    /* Définition de l'animation d'arrière-plan */
    @keyframes gradientBG {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    #playlist {
        max-width: 600px;
        width: 100%;
        background: rgba(255, 255, 255, 0.9); /* Cartes de playlist blanches et semi-transparentes */
        padding: 20px;
        border-radius: 15px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.05); /* Ombre très légère */
    }

    .track {
        display: flex;
        align-items: center;
        margin-bottom: 20px;
        padding: 10px;
        background: #fff;
        border-radius: 10px;
        transition: transform 0.2s ease;
    }

    .track:hover {
        transform: scale(1.02); /* Petit effet au survol */
    }

    .track img {
        width: 60px;
        height: 60px;
        border-radius: 8px;
        margin-right: 15px;
        object-fit: cover;
    }

    .track h3 {
        margin: 0 0 8px 0;
        font-size: 1.1em;
        color: #222;
    }

    audio {
        width: 100%;
        height: 35px;
    }
</style>
